[ci]
provider = "actions"
platform = "github"
runtime = "nix"
runner = "ubuntu-24.04"
nix_builds = [
  ".#packages.x86_64-linux.bekiper-post-analysis",
  ".#packages.x86_64-linux.bekiper",
]

[ci.nix_build]
only = true
timeout_minutes = 360
max_parallel = 2
max_jobs = 1
cores = 2
capture_results = true
artifact_retention_days = 14
