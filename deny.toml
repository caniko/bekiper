[bans]
multiple-versions = 'allow'

[advisories]
ignore = [
  # Unmaintained-only advisories with no safe upgrade available as of 2026-06-01.
  # Revisit when direct dependencies can move away from bincode/rustls-pemfile
  # and when transitive users of paste have migrated.
  "RUSTSEC-2024-0436",
  "RUSTSEC-2025-0134",
  "RUSTSEC-2025-0141",
]

[sources]
allow-git = ["https://github.com/pykeio/ort.git"]

[licenses]
private = { ignore = true }
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "AGPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MIT-0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "WTFPL",
  "Zlib",
  "bzip2-1.0.6",
]
