[package]
name = "bekiper-pose"
description = "Unified markerless pose estimation: read DLC/SLEAP/LP output + ONNX inference"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
full = ["hdf5", "infer", "video", "gpu"]
hdf5 = ["dep:hdf5-metno"]
infer = ["dep:ort", "dep:ndarray", "dep:image"]
video = ["dep:ffmpeg-next", "dep:image"]
gpu = ["infer", "video", "dep:bekiper-gpu"]

[dependencies]
bekiper-core.workspace = true
bekiper-math.workspace = true
bekiper-perimeter.workspace = true
hdf5-metno = { workspace = true, optional = true }
polars.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Inference via ONNX Runtime (behind "infer" feature)
image = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
ort = { workspace = true, optional = true }

# Video frame extraction (behind "video" feature)
ffmpeg-next = { workspace = true, optional = true }

# Zero-copy GPU pipeline (behind "gpu" feature)
bekiper-gpu = { path = "../bekiper-gpu", optional = true }

[dev-dependencies]
toml.workspace = true

[[test]]
name = "test_gpu_pipeline"
path = "tests/test_gpu_pipeline.rs"
required-features = ["gpu"]
