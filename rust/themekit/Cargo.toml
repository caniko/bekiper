[package]
name = "themekit"
description = "Light/dark semantic colour tokens shared by Rust and Python front ends (CSS, matplotlib)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# PyO3 functions a host extension module mounts with `themekit::python::register`.
python = ["dep:pyo3"]

[dependencies]
serde.workspace = true
# Declared directly (not the workspace entry) so the feature does not force
# `extension-module`; the host extension enables that for its own build.
pyo3 = { version = "0.26", optional = true }
