[package]
name = "bekiper-ingress"
description = "Data ingestion, configuration, and workflow orchestration for bekiper"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["full"]
full = ["pose-gpu"]
pose-hdf5 = ["bekiper-pose/hdf5"]
pose-infer = ["bekiper-pose/infer"]
pose-video = ["bekiper-pose/video"]
pose-gpu = [
  "pose-hdf5",
  "pose-infer",
  "pose-video",
  "bekiper-pose/gpu",
  "dep:bekiper-gpu",
]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "fs", "pipe"] }

[dependencies]
anyhow.workspace = true
bekiper-annotation = { workspace = true }
bekiper-behaviour.workspace = true
bekiper-core.workspace = true
bekiper-detect.workspace = true
bekiper-feature.workspace = true
bekiper-gpu = { path = "../bekiper-gpu", optional = true }
bekiper-perimeter.workspace = true
bekiper-pose = { workspace = true, default-features = false }
bekiper-post-analysis.workspace = true
csv.workspace = true
image.workspace = true
indexmap.workspace = true
polars.workspace = true
rayon.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
themekit.workspace = true
toml.workspace = true
tracing.workspace = true
zip.workspace = true

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt"] }
hdf5-metno.workspace = true
