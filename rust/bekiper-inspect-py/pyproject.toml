[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "bekiper-rs"
version = "0.1.0"
description = "Rust-backed bindings of bekiper-core inspection types for Python"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Can H. Tartanoglu", email = "canhtart@gmail.com" }]
requires-python = ">=3.12"

[tool.maturin]
module-name = "bekiper_rs._bekiper_rs"
python-source = "python"
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
